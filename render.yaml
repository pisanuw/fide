services:
  - type: web
    name: fide-lookup
    runtime: python
    plan: starter   # ~320 MB RSS with the rated-only index; free (512 MB) is tight
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: RATE_LIMIT
        value: "60"
