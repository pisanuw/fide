name: Refresh FIDE list

# FIDE publishes a new list at the start of each month. Two runs: the second
# catches a late release. A run is a no-op when players/YYYYMM already exists.
on:
  schedule:
    - cron: "17 9 3 * *"
    - cron: "17 9 8 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Replace the month folder if it already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-fide
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements-dev.txt

      - name: Download and validate
        id: fetch
        run: python scripts/fetch_fide.py ${{ inputs.force && '--force' || '' }}

      - name: Test against the new list
        if: steps.fetch.outputs.changed == 'true'
        run: |
          pytest -q
          python -c "from app.index import PlayerIndex, find_data_file; ix = PlayerIndex.from_zip(find_data_file('players')); r = ix.search('carlsen'); assert r, 'no results'; print(len(ix), r[0]['name'])"

      - name: Commit and push to main
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players/${{ steps.fetch.outputs.month }}
          git commit -m "Add FIDE players list ${{ steps.fetch.outputs.month }}"
          git push origin HEAD:main
