<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIDE lookup</title>
<style>
  body{font:16px/1.4 system-ui,sans-serif;max-width:46rem;margin:2rem auto;padding:0 1rem;color:#222}
  input,select,button{font:inherit;padding:.4rem .6rem}
  #q{width:100%;box-sizing:border-box;font-size:1.2rem;padding:.6rem}
  .row{display:flex;gap:.5rem;align-items:center;margin:.6rem 0;flex-wrap:wrap}
  table{border-collapse:collapse;width:100%}
  td,th{padding:.35rem .5rem;border-bottom:1px solid #ddd;text-align:left}
  .num{text-align:right}
  small,.muted{color:#777}
  code{background:#f2f2f2;padding:0 .25rem}
</style>
</head>
<body>
<input id="q" placeholder="name or FIDE id" autofocus autocomplete="off">
<div class="row">
  <label>Format <select id="fmt"><option>json</option><option>xml</option><option>txt</option></select></label>
  <button id="all" disabled>Download all results</button>
  <span id="status" class="muted"></span>
</div>
<table id="res"></table>
<p><small>API: <code id="api">/api/players?q=pisan</code> &middot; up to 5 matches &middot; <code>format=json|xml|txt</code></small></p>
<script>
const $ = id => document.getElementById(id);
let timer, seq = 0, current = [];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const url = (path, extra='') => path + (path.includes('?') ? '&' : '?') + 'format=' + $('fmt').value + extra;

async function search() {
  const q = $('q').value.trim(), my = ++seq;
  if (!q) { current = []; draw(); $('status').textContent = ''; return; }
  $('api').textContent = '/api/players?q=' + encodeURIComponent(q);
  const t = performance.now();
  try {
    const r = await fetch('/api/players?q=' + encodeURIComponent(q));
    if (my !== seq) return;
    if (r.status === 429) { $('status').textContent = 'Too many requests, slow down'; return; }
    current = await r.json();
    $('status').textContent = current.length + ' found in ' + Math.round(performance.now() - t) + ' ms';
  } catch (e) { $('status').textContent = 'error'; return; }
  draw();
}
function draw() {
  $('all').disabled = !current.length;
  $('res').innerHTML = current.length
    ? '<tr><th>Name</th><th>Fed</th><th>Title</th><th class="num">Std</th><th class="num">Rapid</th><th class="num">Blitz</th><th>FIDE id</th><th></th></tr>' +
      current.map(p => `<tr><td>${esc(p.name)}</td><td>${esc(p.fed)}</td><td>${esc(p.title)}</td>
        <td class="num">${p.rating||''}</td><td class="num">${p.rapid_rating||''}</td><td class="num">${p.blitz_rating||''}</td>
        <td>${p.fideid}</td><td><a href="${url('/api/players/fide/' + p.fideid, '&download=1')}">download</a></td></tr>`).join('')
    : '';
}
$('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 120); });
$('all').onclick = () => { location.href = url('/api/players?q=' + encodeURIComponent($('q').value.trim()), '&download=1'); };
$('fmt').onchange = draw;
</script>
</body>
</html>
